<svg width="150" height="40" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 40">
    <!-- 
      Hna zedna 'text-shadow' qwi kter bach yban l-glow mzyan.
      Kan 3tiwh 2 dyal l-shadows, wa7d qrib (5px) o wa7d b3id (15px).
    -->
    <style>
      .glow-text {
        fill: #00ffff;
        font-family: Orbitron, sans-serif;
        font-weight: 700;
        /* Hada huwa l-Glow effect: */
